server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable Metro bundle output — cache aggressively.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # These must always be revalidated: the manifest rarely changes, and the service worker
    # controls how updates roll out (see public/sw.js) — a stale cached copy of either would
    # trap visitors on an old version.
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Expo Router's static export can't pre-render a page per recording id (they don't exist at
    # build time), so it emits one shell for the whole dynamic route. Any path under /recording/
    # gets that shell; the client-side router then reads the real id from the URL once it loads.
    location /recording/ {
        try_files $uri "/recording/[id].html";
    }

    # Every other route got its own static .html at build time; anything unrecognized falls back
    # to the app shell so client-side routing (and the not-found screen) can take over.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
